# Run the REST gateway on the namenode. host networking lets the container reach
# the cluster's SSH endpoint and lets the client reach the server on port 5000.
services:
  reco-rest:
    build: ./server
    image: ecommerce-reco-rest:1.0
    container_name: reco-rest
    network_mode: host
    environment:
      CC_NN_HOST: "127.0.0.1"      # the namenode (container runs on it)
      CC_VM_USER: "root"
      CC_VM_PASS: "ubuntu"
      CC_SCRIPTS_DIR: "/home/hadoop/cc_build/scripts"
      CC_BASELINE: "/home/hadoop/cc_build/python_baseline/reco_baseline.py"
      CC_HDFS_BASE: "/user/hadoop/ecommerce"
      CC_LOCAL_DATA: "/home/hadoop/data"
      PORT: "5000"
    restart: unless-stopped
